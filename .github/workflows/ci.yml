name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Boot a phone and replay recorded tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Enable KVM so the emulator runs at full speed
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot a phone (downloads the emulator on first run)
        run: node dist/cli.js start --headless

      - name: Replay the example tests
        run: node dist/cli.js test examples

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots
          path: examples/*.failure.png
          if-no-files-found: ignore
