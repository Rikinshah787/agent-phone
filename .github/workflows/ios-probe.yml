name: iOS probe

on:
  push:
    branches: [ios]
    paths: [.github/workflows/ios-probe.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Tool versions
        run: |
          sw_vers; xcodebuild -version; xcrun simctl help | head -3; node -v; brew --version | head -1
          mkdir -p probe

      - name: Install AXe
        run: |
          time brew install cameroncooke/axe/axe
          axe --version || axe --help | head -20

      - name: Simulator inventory
        run: |
          xcrun simctl list runtimes -j > probe/runtimes.json
          xcrun simctl list devicetypes -j > probe/devicetypes.json
          xcrun simctl list devices available -j > probe/devices.json
          xcrun simctl list runtimes
          xcrun simctl list devices available | head -40

      - name: Boot an iPhone
        run: |
          UDID=$(python3 -c "
          import json; d=json.load(open('probe/devices.json'))['devices']
          rt=sorted([k for k in d if 'iOS' in k])[-1]
          phones=[x for x in d[rt] if x['name'].startswith('iPhone') and x['isAvailable']]
          print(phones[0]['udid'])")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl list devices | grep "$UDID"
          time xcrun simctl boot "$UDID"
          time xcrun simctl bootstatus "$UDID" -b
          sleep 5

      - name: Probe screen reading and screenshots
        run: |
          set +e -x
          xcrun simctl io "$UDID" screenshot probe/00-after-boot.png
          time xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 8
          xcrun simctl io "$UDID" screenshot probe/01-settings-headless.png
          axe describe-ui --udid "$UDID" > probe/01-ui-headless.json 2> probe/01-ui-headless.err; echo "describe-ui headless exit $?"
          cat probe/01-ui-headless.err
          # Now with the Simulator app window open
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15
          xcrun simctl io "$UDID" screenshot probe/02-settings-window.png
          for i in 1 2 3; do
            /usr/bin/time -p axe describe-ui --udid "$UDID" > probe/02-ui-window.json 2> probe/02-ui-window.err; rc=$?
            echo "describe-ui with window, attempt $i: exit $rc"; tail -3 probe/02-ui-window.err
            [ $rc -eq 0 ] && break; sleep 5
          done
          head -c 4000 probe/02-ui-window.json; echo
          time axe screenshot --output probe/03-axe.png --udid "$UDID"
          time xcrun simctl io "$UDID" screenshot --type=png probe/03-simctl.png
          time xcrun simctl io "$UDID" screenshot --type=jpeg probe/03-simctl.jpg
          sips -g pixelWidth -g pixelHeight probe/03-simctl.png
          ls -la probe
          exit 0

      - name: Probe tapping, scrolling and typing
        run: |
          set +e -x
          time axe tap --label "General" --udid "$UDID"; echo "tap exit $?"
          sleep 2
          axe describe-ui --udid "$UDID" > probe/10-general-ui.json
          xcrun simctl io "$UDID" screenshot probe/10-general.png
          time axe gesture scroll-down --udid "$UDID"; echo "gesture exit $?"
          sleep 1
          axe describe-ui --udid "$UDID" > probe/11-general-scrolled-ui.json
          xcrun simctl io "$UDID" screenshot probe/11-general-scrolled.png
          time axe drag --start-x 200 --start-y 700 --end-x 200 --end-y 400 --duration 0.6 --udid "$UDID"; echo "drag exit $?"
          sleep 1
          axe describe-ui --udid "$UDID" > probe/12-after-drag-ui.json
          time axe button home --udid "$UDID"; echo "home exit $?"
          sleep 2
          xcrun simctl io "$UDID" screenshot probe/13-home.png
          axe describe-ui --udid "$UDID" > probe/13-home-ui.json
          time xcrun simctl openurl "$UDID" "https://example.com"; echo "openurl exit $?"
          sleep 8
          axe describe-ui --udid "$UDID" > probe/14-safari-ui.json
          xcrun simctl io "$UDID" screenshot probe/14-safari.png
          time xcrun simctl ui "$UDID" appearance dark; echo "appearance exit $?"
          xcrun simctl launch "$UDID" com.apple.Preferences
          sleep 3
          axe tap --label "Search" --udid "$UDID"; echo "tap search exit $?"
          sleep 2
          time axe type 'wallpaper' --udid "$UDID"; echo "type exit $?"
          sleep 2
          axe describe-ui --udid "$UDID" > probe/15-search-ui.json
          xcrun simctl io "$UDID" screenshot probe/15-search-dark.png
          exit 0

      - name: Probe app control and logs
        run: |
          set +e -x
          xcrun simctl listapps "$UDID" | plutil -convert json -o probe/listapps.json - ; echo "listapps exit $?"
          head -c 1500 probe/listapps.json; echo
          time xcrun simctl terminate "$UDID" com.apple.mobilesafari; echo "terminate exit $?"
          xcrun simctl terminate "$UDID" com.apple.mobilesafari; echo "terminate again exit $?"
          xcrun simctl get_app_container "$UDID" com.apple.Preferences data; echo "container exit $?"
          time xcrun simctl spawn "$UDID" log show --last 1m --style compact > probe/log.txt 2>&1; echo "log exit $?"
          tail -15 probe/log.txt
          ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | head
          exit 0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-probe
          path: probe/
